events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;

    server {
        listen 80;

        location /job {
            proxy_pass http://job-service:8080/job;
        }

        location /candidate {
            proxy_pass http://candidate-service:8080/candidate;
        }

        location / {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;
        }
    }
}