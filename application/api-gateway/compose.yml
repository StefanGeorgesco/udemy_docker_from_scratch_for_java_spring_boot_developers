services:
  mongo:
    image: mongo:latest
    volumes:
      - ./script:/docker-entrypoint-initdb.d:ro

  job-service:
    build: ../job-service
    image: job-service
    environment:
      SPRING_MONGODB_URI: mongodb://job_user:job_password@mongo:27017/job
    depends_on:
      - mongo
    restart: always
    deploy:
      replicas: 2

  candidate-service:
    build: ../candidate-service
    image: candidate-service
    environment:
      SPRING_MONGODB_URI: mongodb://candidate_user:candidate_password@mongo:27017/candidate
      JOB_SERVICE_URL: http://job-service:8080/job
    depends_on:
      - mongo
    restart: always
    deploy:
      replicas: 2

  nginx:
    image: nginx:latest
    ports:
      - "80:80"
    depends_on:
      - job-service
      - candidate-service
    restart: always
    volumes:
      - ./conf/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./html:/usr/share/nginx/html:ro
